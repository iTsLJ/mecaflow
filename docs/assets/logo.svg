<svg width="560" height="170" viewBox="0 0 560 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MecaFlow">
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Engrenagem -->
  <g transform="translate(85,85)">
    <g fill="url(#amber)">
      <rect x="-9" y="-64" width="18" height="26" rx="4"/>
      <rect x="-9" y="-64" width="18" height="26" rx="4" transform="rotate(45)"/>
      <rect x="-9" y="-64" width="18" height="26" rx="4" transform="rotate(90)"/>
      <rect x="-9" y="-64" width="18" height="26" rx="4" transform="rotate(135)"/>
      <rect x="-9" y="-64" width="18" height="26" rx="4" transform="rotate(180)"/>
      <rect x="-9" y="-64" width="18" height="26" rx="4" transform="rotate(225)"/>
      <rect x="-9" y="-64" width="18" height="26" rx="4" transform="rotate(270)"/>
      <rect x="-9" y="-64" width="18" height="26" rx="4" transform="rotate(315)"/>
    </g>
    <circle r="50" fill="url(#amber)"/>
    <circle r="30" fill="#1f2937"/>
    <!-- Marca de fluxo (raio) -->
    <path d="M 6 -20 L -10 4 L 2 4 L -6 22 L 14 -4 L 1 -4 Z" fill="#fbbf24"/>
  </g>

  <!-- Wordmark -->
  <text x="165" y="98" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700">
    <tspan fill="#1f2937">Meca</tspan><tspan fill="#f59e0b">Flow</tspan>
  </text>
  <text x="167" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" letter-spacing="2" fill="#6b7280">
    GESTÃO PARA OFICINAS MECÂNICAS
  </text>
</svg>
